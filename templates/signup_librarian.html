{% extends 'base.html' %}
{% block title %}Sign Up - Librarian{% endblock %}
{% block content %}
  <h2>Create Librarian Account</h2>
  <form method="post" class="centered-form">
    <label>Name</label>
    <input type="text" name="name" required />
    <label>Email</label>
    <input type="email" name="email" required />
    <button type="submit">Create Librarian</button>
  </form>
{% endblock %}
