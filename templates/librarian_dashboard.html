{% extends 'base.html' %}
{% block title %}Librarian Dashboard{% endblock %}
{% block content %}
  <h2>Welcome, {{ name }}</h2>
  <div class="grid">
    <div class="card">Books: {{ books_count }}</div>
    <div class="card">Members: {{ members_count }}</div>
    <div class="card">Borrowed (active): {{ borrowed_count }}</div>
  </div>
  <p><a href="{{ url_for('add_book') }}">Add Book</a> | <a href="{{ url_for('librarian_books') }}">Manage Books</a> | <a href="{{ url_for('librarian_members') }}">Members</a></p>
{% endblock %}
