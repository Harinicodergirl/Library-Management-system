{% extends 'base.html' %}
{% block title %}Add Member{% endblock %}
{% block content %}
  <h2>Add Member</h2>
  <form method="post">
    <label>Name</label>
    <input type="text" name="name" required />
    <label>Email</label>
    <input type="email" name="email" required />
    <button type="submit">Add</button>
  </form>
{% endblock %}
